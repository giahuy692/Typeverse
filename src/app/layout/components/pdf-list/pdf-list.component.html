<div>
  <button (click)="switchType('reading')" [disabled]="pdfType === 'reading'">Reading</button>
  <button (click)="switchType('listening')" [disabled]="pdfType === 'listening'">Listening</button>
</div>
<div>
  <div *ngFor="let pdf of pdfFiles">
    <a (click)="selectPdf(pdf)">{{pdf}}</a>
  </div>
  <iframe *ngIf="selectedPdf" [src]="'assets/pdf/' + selectedPdf" width="100%" height="600px"></iframe>
</div>
