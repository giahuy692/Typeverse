<div class="bg-[#181f2a] flex flex-col">
  <!-- Header luôn trên cùng -->
  <!-- <app-header *ngIf="showHeader"></app-header> -->
  <div class="flex flex-1 layout-main">
    <!-- Sidebar luôn sát trái, chiếm full height của content bên dưới header -->
    <aside class="w-56 bg-[#202738] border-r border-[#232c41] shadow-lg flex-shrink-0 flex flex-col">
      <app-sidebar-menu [currentAppMode]="currentAppMode" (modeChange)="changeAppMode($event)"></app-sidebar-menu>
    </aside>
    <!-- Main Content nằm bên phải sidebar, chiếm phần còn lại -->
    <main class="flex-1 flex flex-col">
      <section class="flex-1 flex flex-col">
        <!-- <app-welcome *ngIf="currentAppMode === 'idle'"></app-welcome> -->
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</div>
