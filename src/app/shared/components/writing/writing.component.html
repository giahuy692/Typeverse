<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<div class="main-container">

  <div class="bg-[#1e293b] p-6 rounded-xl shadow-lg border border-[#334155] space-y-4 transition-all m-5"
    *ngFor="let a of data" >
    <div class="bg-slate-700/40 text-white p-4 rounded-md font-medium tracking-wide text-lg">
      {{ a.question }}
    </div>
    <div>
      <div class="bg-emerald-500/5 border border-emerald-500 text-emerald-100 p-4 rounded-md text-lg leading-relaxed flex-grow-1">
        {{ a.answer }}
      </div>
    </div>
  </div>
</div>
