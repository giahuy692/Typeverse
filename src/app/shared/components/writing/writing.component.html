<div class="mx-auto px-4 py-6 space-y-6 text-gray-800 font-sans">
  <h1 class="text-2xl font-bold text-center text-gray-900">Writing Practice</h1>

  <div class="bg-primary p-6 rounded-xl shadow border space-y-4">
    <div class="flex justify-between items-center">
      <p class="font-semibold text-sm">Prompt {{ currentIndex + 1 }}/{{ totalQuestions }}</p>
      <div class="text-sm text-gray-600 flex gap-6">
        <span><strong class="text-indigo-600">WPM:</strong> {{ writingWPM }}</span>
        <span><strong class="text-green-600">Accuracy:</strong> {{ writingAccuracy }}%</span>
      </div>
    </div>

    <div class="bg-gray-50 p-4 rounded font-mono text-gray-600 text-sm leading-relaxed">
      {{ currentQuestion?.answer }}
    </div>

    <textarea [(ngModel)]="userTyping" (input)="onTypingChange()" rows="6"
      class="w-full border border-gray-300 rounded p-3 font-mono text-sm focus:outline-none focus:ring focus:border-indigo-300 bg-primary"
      placeholder="Start typing...">
    </textarea>

    <div class="flex justify-between items-center">
      <div class="flex gap-2">
        <button (click)="prev()"
          class="bg-gray-100 px-4 py-2 rounded hover:bg-gray-200 text-sm">Previous</button>
        <button (click)="next()"
          class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 text-sm">Next</button>
      </div>
      <button (click)="resetWriting()"
        class="text-orange-600 border border-orange-300 bg-orange-50 px-4 py-2 rounded hover:bg-orange-100 text-sm">
        🔄 Restart
      </button>
    </div>
  </div>
</div>
