<div *ngIf="isListeningActive || isSpeakingActive || isVideoMode" class="mx-auto px-4 py-6 space-y-6 text-gray-900 font-sans">

  <h1 class="text-white text-2xl font-bold text-center">{{currentMode}} Practice</h1>
  <div *ngIf="isCountdown && countdown > 0" class="text-center text-yellow-400 text-4xl font-bold animate-pulse">
    {{ countdown }}s
  </div>

  <div *ngIf="isListeningMode" class="bg-primary p-4 rounded-xl shadow border flex flex-col gap-4">
    <div class="flex items-center gap-4">
      <span class="text-nowrap text-sm font-medium flex items-center gap-1">🔊 Main Audio</span>
      <button [disabled]="!answerAudio" *ngIf="isListeningMode" (click)="toggleAnswerAudio()" [ngClass]="{
          'bg-yellow-600 hover:bg-yellow-700': !answerAudio?.paused,
          'bg-green-600 hover:bg-green-700': answerAudio?.paused
        }" class="px-4 py-1 rounded text-white">
        {{ answerAudio?.paused ? '▶️' : '⏸️' }}
      </button>
      <input type="range" min="0" max="1" step="0.05" [value]="audioVolume"
        (input)="updateAudioVolume($any($event.target).value)" class="w-full accent-blue-500">
    </div>

    <div class="flex items-center gap-4">
      <span class="text-nowrap text-sm font-medium flex items-center gap-1">🎵 Background Music</span>
      <button (click)="toggleBackgroundMute()"
        class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded text-sm">
        {{ backgroundMuted ? '🔇' : '🔈' }}
      </button>
      <input type="range" min="0" max="1" step="0.05" [value]="backgroundMusic.volume"
        (input)="updateBackgroundVolume($any($event.target).value)" class="w-full accent-indigo-300">
    </div>
  </div>

  <div class="flex justify-around gap-4 items-center px-4 py-1 bg-primary rounded-[15px] ring-1 ring-white">
    </div>
  <div class="bg-[#1e293b] p-6 rounded-xl shadow-lg border border-[#334155] space-y-4 transition-all">
    </div>
</div>

<div *ngIf="showToast" [@toastAnim]
  class="fixed bottom-6 right-6 bg-primary/80 text-white px-4 py-2 rounded shadow-lg text-sm z-50">
  {{ toastMessage }}
</div>

<app-writing
  *ngIf="mode === 'writing'"
  [currentQuestion]="currentQuestion"
  [currentIndex]="currentIndex"
  [totalQuestions]="data.length"
  [showAnswer]="showAnswer"
  (prevQuestion)="prevAudio()"
  (nextQuestion)="nextAudio()">
</app-writing>
